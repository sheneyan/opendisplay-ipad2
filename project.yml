name: LegacyDisplay
options:
  bundleIdPrefix: com.sheneyan.oldipad
  deploymentTarget:
    iOS: '9.0'
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.sheneyan.oldipad.display
    ARCHS: armv7
    VALID_ARCHS: armv7
    ONLY_ACTIVE_ARCH: YES
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: iphoneos
    CLANG_ENABLE_MODULES: NO
    ENABLE_BITCODE: NO
    OTHER_LDFLAGS: '-Wl,-ld_classic'
targets:
  LegacyDisplay:
    type: application
    platform: iOS
    sources: [app]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '2'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: app/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
